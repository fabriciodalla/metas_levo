server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Django Admin vive em /admin/ (fora do prefixo /api/) — sem este bloco, cai no catch-all do
    # SPA abaixo e serve index.html no lugar da tela de login do Admin.
    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # NÃO usar $scheme: a conexão do túnel Cloudflare até este nginx é HTTP puro (TLS é
        # encerrado na borda) — $scheme aqui dentro sempre valeria "http" e sobrescreveria
        # silenciosamente o X-Forwarded-Proto: https que o túnel já manda.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Onde o whitenoise serve o resultado do collectstatic (CSS/JS do Django Admin).
    location /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Fallback de SPA: navegação direta numa rota do React Router precisa cair no index.html,
    # não em 404.
    location / {
        try_files $uri /index.html;
    }
}
