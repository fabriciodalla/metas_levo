server {
    # Imagem nginx-unprivileged: roda sem root, então não pode abrir porta < 1024.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Django Admin vive em /admin/ (fora do prefixo /api/) — sem este bloco, cai no catch-all do
    # SPA abaixo e serve index.html no lugar da tela de login do Admin.
    location /admin/ {
        proxy_pass http://backend:8000;
        # Reescreve o Host pro alvo interno: o Django nunca vê o domínio público, então
        # DJANGO_ALLOWED_HOSTS não depende dele (padrão igual à metas_bello).
        proxy_set_header Host backend:8000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # NÃO usar $scheme: a conexão do Traefik até este nginx é HTTP puro pela rede interna do
        # Docker (TLS é encerrado na Cloudflare/Traefik) — $scheme aqui dentro sempre valeria
        # "http" e sobrescreveria silenciosamente o X-Forwarded-Proto: https que o Traefik já manda.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host backend:8000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Onde o whitenoise serve o resultado do collectstatic (CSS/JS do Django Admin).
    location /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host backend:8000;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Fallback de SPA: navegação direta numa rota do React Router precisa cair no index.html,
    # não em 404.
    location / {
        try_files $uri /index.html;
    }
}
