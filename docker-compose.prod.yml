# Stack de produção — separada de docker-compose.yml (dev) de propósito, ver CLAUDE.md.
# Uso:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Backend: gunicorn + collectstatic e migrate automáticos no start (backend/entrypoint.prod.sh).
# Frontend: build estático do Vite servido por nginx (usuário sem privilégio, porta 8080), que
# também faz proxy de /api/, /admin/ e /static/ pro backend (frontend/nginx.conf) — mesma origem
# pra SPA e API, sem CORS.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-metaslevo}
      POSTGRES_USER: ${POSTGRES_USER:-metaslevo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD nas variáveis de ambiente}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-metaslevo}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    env_file:
      - .env
    environment:
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-60}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, não localhost: a imagem nginx-unprivileged só escuta em IPv4 (o script do
      # entrypoint que adicionaria o listener IPv6 não consegue escrever no default.conf, que é
      # somente leitura), mas "localhost" resolve pra ::1 primeiro no container — wget sem
      # fallback de família dá "connection refused" mesmo com o nginx no ar. Achado testando
      # localmente com `docker compose -p ... -f docker-compose.prod.yml up`.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
